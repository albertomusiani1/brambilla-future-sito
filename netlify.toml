# Configurazione di deploy su Netlify.
# Le chiavi API non stanno qui: si impostano in
# Site configuration → Environment variables (vedi .env.example).

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

  # Non ricostruire il sito per un commit che tocca solo la documentazione.
  #
  # Netlify esegue questo comando prima di decidere se costruire: se esce con
  # 0 salta la build, se esce con 1 costruisce. `git diff --quiet` esce con 0
  # quando NON ci sono differenze — quindi qui si legge «se fuori dai file .md
  # e da reports/ non è cambiato niente, non c'è niente da pubblicare».
  #
  # Perché conta: su questo piano ogni deploy di produzione costa crediti, e
  # sono contati. Nella storia del progetto tre commit su dodici toccavano
  # solo README, GUIDA o PLAN: tre ricostruzioni di un sito identico, un
  # quarto del budget mensile speso per niente.
  #
  # Al primo deploy la variabile del commit precedente è vuota, il comando
  # fallisce e il sito viene costruito: l'errore, se c'è, sbaglia nel verso
  # giusto.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)*.md' ':(exclude)reports/'"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# Reindirizzamenti
# ---------------------------------------------------------------------------

# URL parlante per la funzione del modulo contatti.
[[redirects]]
  from = "/api/contatti"
  to = "/.netlify/functions/contact"
  status = 200
  force = true

# NOTA — qui c'era una regola di reindirizzamento dagli URL con slash finale
# a quelli senza:
#
#     from = "/*/"   to = "/:splat"   status = 301   force = true
#
# Era sbagliata e mandava il sito in errore. Sulla home la parte "*" può
# corrispondere alla stringa vuota, quindi "/" corrispondeva alla regola e
# veniva reindirizzata a "/": un ciclo infinito, che il browser interrompe con
# ERR_TOO_MANY_REDIRECTS. Il "force = true" peggiorava le cose, perche applica
# la regola anche quando il file esiste davvero.
#
# La forma canonica dell'URL è comunque garantita, in due modi che non possono
# innescare cicli:
#   - Netlify normalizza da sé lo slash finale sui siti pubblicati a cartelle;
#   - ogni pagina dichiara il proprio <link rel="canonical"> senza slash finale
#     (vedi src/components/SEO.astro), ed è questo il meccanismo che i motori di
#     ricerca usano davvero per non contare due volte la stessa pagina.
#
# Se un giorno servisse davvero una regola esplicita, va scritta in modo che non
# possa mai corrispondere alla radice, e va provata in un deploy di prova: le
# verifiche locali del progetto NON leggono questo file.

# ---------------------------------------------------------------------------
# BLOCCO DELL'INDICIZZAZIONE — sito di prova
#
# Finché queste righe ci sono, il sito è raggiungibile da chiunque abbia
# l'indirizzo ma NON compare su Google: l'intestazione X-Robots-Tag chiede ai
# motori di non inserirlo nei risultati e di non seguirne i collegamenti.
#
# Serve perché il sito contiene ancora contenuti segnaposto — ragione sociale,
# partita IVA, indirizzo e recapiti inventati — che la home dichiara a Google
# come scheda aziendale (dati strutturati LocalBusiness). Far indicizzare
# un'anagrafica finta si disfa male: le pagine restano nella cache dei motori
# per settimane dopo che le hai corrette.
#
# COME APRIRE IL SITO A GOOGLE, quando i contenuti sono quelli veri:
#   1. cancella l'intero blocco [[headers]] qui sotto (dalla riga successiva
#      fino a "X-Robots-Tag" compresa);
#   2. fai commit e push: Netlify ripubblica da solo;
#   3. verifica su https://<il-tuo-sito>/ con Ispeziona → Rete che l'header
#      X-Robots-Tag non ci sia più;
#   4. registra il sito su Google Search Console e invia sitemap-index.xml.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ---------------------------------------------------------------------------
# Intestazioni di sicurezza
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    # challenges.cloudflare.com serve solo il widget antispam della pagina
    # contatti: è l'unico dominio terzo previsto dal sito.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# I file con impronta nel nome possono restare in cache per un anno.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
